<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/escolhidos/favicon.ico">
</head>

<body>
    <header>
        <img src="img/escolhidos/fotoLogo.png" alt="logoFriends">
        <p class="paragrafo1">Aquele em que você revê os melhores momentos de Friends!</p>
        <p> Explore nossas imagens por categoria</p>
    </header>
    <nav class="filtros">
        <button class="filtro ativo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="Personagens">Personagens</button>
        <button class="filtro" data-filtro="Lugares">Lugares</button>
        <button class="filtro" data-filtro="Casais">Casais</button>
    </nav>
    <p id="totalImagens" class="total"></p>
    <main class="galeria">
        <img src="img/escolhidos/foto1.jpg" alt="Personagens Milk Shake" class="miniatura destaque"
            data-categoria="Personagens"
            data-descricao="Entre cafés, milk-shakes, brincadeiras e muitas risadas, os seis amigos mostram que a felicidade está nas pequenas coisas compartilhadas juntos."
            tabindex="0">
        <img src="img/escolhidos/foto2.jpg" alt="Sofá De Abertura" class="miniatura horizontal" data-categoria="Lugares"
            data-descricao="Um dos cenários mais marcantes da televisão! O sofá em frente à fonte se tornou símbolo de uma série que conquistou gerações e transformou seis amigos em uma família."
            tabindex="0">
        <img src="img/escolhidos/foto3.jpg" alt="Monica & Pheobe & Rachel" class="miniatura"
            data-categoria="Personagens"
            data-descricao="Três personalidades diferentes, uma amizade inseparável. Porque, no fim, a vida fica muito melhor quando temos umas às outras."
            tabindex="0">
        <img src="img/escolhidos/foto4.jpg" alt="Ross & Rachel" class="miniatura vertical" data-categoria="Casais"
            data-descricao="Um amor cheio de idas e vindas, provando que algumas histórias são simplesmente inesquecíveis. Afinal, they were on a break!"
            tabindex="0">
        <img src="img/escolhidos/foto5.jpg" alt="Casa da Monica" class="miniatura" data-categoria="Lugares"
            data-descricao="Mais do que um apartamento, um lugar onde nasceram amizades, histórias inesquecíveis e momentos que sempre terão um espaço especial no coração dos fãs."
            tabindex="0">
        <img src="img/escolhidos/foto6.jpg" alt="Casamento Monica & Chandler" class="miniatura horizontal"
            data-categoria="Casais"
            data-descricao="De melhores amigos a marido e mulher: uma história de amor que mostrou que, às vezes, o amor da sua vida também pode ser seu melhor amigo."
            tabindex="0">
        <img src="img/escolhidos/foto7.jpg" alt="Central Perk" class="miniatura" data-categoria="Lugares"
            data-descricao="O ponto de encontro favorito dos seis amigos, onde um simples café se transformava em horas de conversas, risadas e histórias inesquecíveis."
            tabindex="0">
        <img src="img/escolhidos/foto8.jpg" alt="Chandler & Joey & Ross" class="miniatura" data-categoria="Personagens"
            data-descricao="Quando o assunto é amizade, esses três são especialistas! Ross, Chandler e Joey provaram que até os momentos mais simples podem se transformar em boas histórias."
            tabindex="0">
        <img src="img/escolhidos/foto9.jpg" alt="Abertura Guarda-Chuva" class="miniatura horizontal"
            data-categoria="Personagens"
            data-descricao="Seis amigos, personalidades completamente diferentes e uma amizade que transformou momentos simples em lembranças inesquecíveis. Porque, no final, juntos eles sempre foram melhores!"
            tabindex="0">
    </main>
    <div id="modal" class="modal">
        <button id="fechar" class="fechar">&times;</button>
        <button id="anterior" class="navegacao anterior">&#10094;</button>
        <div class="modal-conteudo">
            <img src="" alt="Imagem Ampliada" id="imagensModal">
            <div class="legenda">
                <span id="contador"></span>
                <span id="nomeImagem"></span>
            </div>
            <p id="descricaoImagem" class="descricao-imagem"></p>
        </div>
        <button id="proximo" class="navegacao proximo">&#10095;</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
